<mat-toolbar color="primary">
  <mat-toolbar-row >
    <span>{{boardBanner}}</span>
    @if (checkToken() | async; as tk) {
      <button class="button-left" mat-flat-button color="warn" matTooltip="Clear the connection" (click)="clearConn()">Clear</button>
    } @else {
      <button class="button-left" mat-flat-button color="accent" matTooltip="Initiate connection" (click)="initConnect()">Connect</button>
    }
  </mat-toolbar-row>
</mat-toolbar>
